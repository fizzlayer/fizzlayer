# Shared fleet. One agentgateway serves gateway A, gateway B, and a low rate-limit route.
# The mock control plane stands in for GET /api/gateway/agent/fleet.
name: fizzlayer-gateway-hosted

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fizz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fizz
    volumes:
      - ./init/00-local-prereqs.sql:/docker-entrypoint-initdb.d/00-local-prereqs.sql:ro
      - ../../supabase/migrations/20261114000000_gateway.sql:/docker-entrypoint-initdb.d/10-gateway.sql:ro
      - ../../supabase/migrations/20261114000300_gateway_policies.sql:/docker-entrypoint-initdb.d/11-gateway-policies.sql:ro
      - ../../supabase/migrations/20261119000000_gateway_trust_new_tools.sql:/docker-entrypoint-initdb.d/13-gateway-trust.sql:ro
      - ./init/20-runtime-login.sh:/docker-entrypoint-initdb.d/20-runtime-login.sh:ro
      - ./init/40-hosted-seed.sql:/docker-entrypoint-initdb.d/40-hosted-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizz -d fizz"]
      interval: 2s
      timeout: 5s
      retries: 30

  control-plane:
    image: fizzlayer-gateway-dev:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["fizz-control-mock", "serve"]
    environment:
      FIZZ_FLEET: "1"
      FIZZ_LISTEN: 0.0.0.0:8090
      FIZZ_PUBLIC_URL: http://control-plane:8090
      FIZZ_SIGNING_KEY: /keys/signing.pem
      FIZZ_FLEET_TOKEN: ${FIZZ_FLEET_TOKEN}
      FIZZ_UPSTREAM_KEY: ${FIZZ_UPSTREAM_KEY}
    volumes:
      - keys:/keys
    healthcheck:
      test: ["CMD", "/usr/local/bin/fizz-control-mock", "ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  fizz-agent:
    image: fizzlayer-gateway-dev:local
    command: ["fizz-agent", "pull"]
    environment:
      FIZZ_API_URL: http://control-plane:8090
      FIZZ_FLEET_TOKEN: ${FIZZ_FLEET_TOKEN}
      FIZZ_CONFIG_OUT: /config/config.yaml
      FIZZ_POLL_SECS: "1"
    volumes:
      - config:/config
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /config/config.yaml"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  fizz-guard:
    image: fizzlayer-gateway-dev:local
    command: ["fizz-guard", "serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIZZ_GUARD_LISTEN: 0.0.0.0:9001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/fizz-guard", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  sample-mcp:
    image: fizzlayer-gateway-dev:local
    command: ["sample-mcp", "serve"]
    environment:
      SAMPLE_PORT: "8080"
      SAMPLE_UPSTREAM_KEY: ${FIZZ_UPSTREAM_KEY}
    healthcheck:
      test: ["CMD", "/usr/local/bin/sample-mcp", "ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  sample-b:
    image: fizzlayer-gateway-dev:local
    command: ["sample-mcp", "serve"]
    environment:
      SAMPLE_PORT: "8082"
    healthcheck:
      test: ["CMD", "/usr/local/bin/sample-mcp", "ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  sample-extra:
    image: fizzlayer-gateway-dev:local
    command: ["sample-mcp", "serve"]
    environment:
      SAMPLE_PORT: "8081"
      SAMPLE_TOOL_NAME: echo
    healthcheck:
      test: ["CMD", "/usr/local/bin/sample-mcp", "ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    entrypoint: ["/app/agentgateway"]
    command: ["-f", "/config/config.yaml"]
    environment:
      SESSION_KEY: disabled
      RUST_LOG: warn
    volumes:
      - config:/config:ro
    depends_on:
      fizz-agent:
        condition: service_healthy
      fizz-guard:
        condition: service_healthy
      sample-mcp:
        condition: service_healthy
      sample-b:
        condition: service_healthy
      sample-extra:
        condition: service_healthy
    restart: unless-stopped

  hosted-e2e:
    image: fizzlayer-gateway-dev:local
    command: ["fizz-hosted-probe"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIZZ_SIGNING_KEY: /keys/signing.pem
      FIZZ_CONTROL_URL: http://control-plane:8090
      FIZZ_FLEET_TOKEN: ${FIZZ_FLEET_TOKEN}
      FIZZ_UPSTREAM_KEY: ${FIZZ_UPSTREAM_KEY}
      GATEWAY_ORIGIN: http://agentgateway:3000
    volumes:
      - keys:/keys:ro
    depends_on:
      agentgateway:
        condition: service_started
      fizz-guard:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  keys:
  config:
