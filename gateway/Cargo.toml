[package]
name = "fizz-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Fizzlayer gateway config generator, client JWTs, and fizz-guard"

[dependencies]
axum = "0.7"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
prost = "0.13"
prost-types = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tonic = "0.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "fizz-config"
path = "src/bin/fizz-config.rs"

[[bin]]
name = "fizz-guard"
path = "src/bin/fizz-guard.rs"

[[bin]]
name = "sample-mcp"
path = "src/bin/sample-mcp.rs"

[[bin]]
name = "fizz-mcp-probe"
path = "src/bin/fizz-mcp-probe.rs"
