[package]
name = "fizz-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Pair a device with Fizz and stream its readings"
license = "Apache-2.0"

[[bin]]
name = "fizz"
path = "src/main.rs"

[dependencies]
fizz-protocol = { path = "../supabase/compute/fizz-protocol" }
libc = "0.2"
serde_json = "1"
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep this table in sync with the root Cargo.toml,
# supabase/compute/fizz-worker/Cargo.toml, and
# supabase/compute/fizz-protocol/Cargo.toml.
#
# Levels are warn. The lint workflow passes `-D warnings`, so a warning fails CI.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
map_unwrap_or = "warn"
manual_let_else = "warn"
unreadable_literal = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
uninlined_format_args = "warn"
ignored_unit_patterns = "warn"
format_collect = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_assert = "warn"
manual_string_new = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
match_same_arms = "warn"
single_match_else = "warn"
