[package]
name = "fizz-cli"
version = "0.2.0"
edition = "2024"
description = "Pair a device with Fizz and stream its readings"
license = "MIT"

[[bin]]
name = "fizz"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
