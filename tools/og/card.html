<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fizzlayer social card</title>
    <!-- Served next to public/ by render.mjs so the site's own styles, fonts, and icons apply. -->
    <link rel="stylesheet" href="/design.css">
    <link rel="stylesheet" href="/landing.css">
    <script src="/sensor-kinds.js"></script>
    <style>
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { color: var(--ink); background: radial-gradient(ellipse at 88% 30%, #dcf1f5 0, transparent 55%), linear-gradient(#fcfdfd, #f3f8fa); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .card { display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 40px; height: 100%; padding: 0 64px 0 80px; box-sizing: border-box; }
      .eyebrow-label { margin: 0 0 14px; font-size: 16px; }
      h1 { margin: 0 0 0 -6px; font-family: var(--display); font-size: 128px; font-weight: 600; line-height: 1; letter-spacing: -6px; }
      h1 .brand-dot { color: var(--accent); }
      .tagline { margin: 22px 0 0; font-family: var(--display); font-size: 40px; font-weight: 500; line-height: 1.15; letter-spacing: -1.4px; }
      .tagline span { color: #18849c; }
      .kinds { display: flex; gap: 10px; margin-top: 30px; }
      .kind-badge { display: inline-grid; place-items: center; width: 42px; height: 42px; background: color-mix(in srgb, var(--sensor-color) 12%, white); border: 1px solid color-mix(in srgb, var(--sensor-color) 28%, #e3ebf0); border-radius: 9px; color: color-mix(in srgb, var(--sensor-color) 65%, #183e52); }
      .kind-badge svg { width: 22px; height: 22px; fill: currentColor; }
      .cta { display: flex; align-items: center; gap: 18px; margin-top: 34px; }
      .cta .button { gap: 13px; padding: 14px 20px; font-size: 18px; pointer-events: none; }
      .cta .url { color: #47616f; font: 18px var(--mono); }
      .world-frame { aspect-ratio: 1; box-shadow: 0 34px 70px -28px #22495a70, 0 0 0 7px #fff9; }
      .world-lines { inset: 0; width: 100%; height: 100%; }
      .world-lines .orbit { stroke: #81d0de26; }
      .world-core { top: 50%; left: 50%; width: 70%; transform: translate(-50%, -50%); border-radius: 36px; box-shadow: 0 0 90px #a9eaf726, inset 0 0 28px #a9eaf70d; }
      .world-core img { width: 92%; }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="eyebrow-label"><span class="status-dot" aria-hidden="true"></span> Meet Fizz, your new sidekick</p>
        <h1>Fizzlayer<span class="brand-dot">.</span></h1>
        <p class="tagline">The physical layer<br>for <span>AI agents.</span></p>
        <div class="kinds" id="kinds"></div>
        <div class="cta"><span class="button button-dark">Start free <span class="fa-arrow fa-arrow-right" aria-hidden="true"></span></span><span class="url">fizzlayer.com</span></div>
      </div>
      <div class="world-frame">
        <svg class="world-lines" viewBox="0 0 400 400" aria-hidden="true">
          <circle class="orbit" cx="200" cy="200" r="185"/><circle class="orbit" cx="200" cy="200" r="160"/>
          <circle cx="58" cy="118" r="3" fill="#a9eaf7"/><circle cx="352" cy="140" r="3" fill="#5ee6c4"/><circle cx="330" cy="318" r="3" fill="#bcb7f4"/><circle cx="76" cy="300" r="3" fill="#a9eaf7"/>
        </svg>
        <div class="world-core"><img src="/fizz-agent.svg" alt=""></div>
      </div>
    </div>
    <script>
      const kinds = document.getElementById('kinds');
      for (const kind of ['water', 'gas', 'radio', 'temperature', 'pressure', 'humidity', 'sound', 'phone', 'custom']) kinds.append(window.fizzKinds.badge(kind));
    </script>
  </body>
</html>
