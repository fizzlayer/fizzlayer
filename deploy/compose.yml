# Fizzlayer without a git checkout.
#
#   mkdir fizzlayer && cd fizzlayer
#   curl -fsSL https://raw.githubusercontent.com/fizzlayer/fizzlayer/main/deploy/compose.yml -o compose.yml
#   curl -fsSL https://raw.githubusercontent.com/fizzlayer/fizzlayer/main/deploy/compose.env.example -o .env.example
#   docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/out" fizzlayer/fizzlayer-api:latest init --out /out/.env
#   docker compose up -d
#
# Images only: no build and no files from a clone. SQL migrations are inside
# fizzlayer/fizzlayer-api. The migrate service runs them once GoTrue is up.
# COMPOSE_PROFILES=local (written by the init script) starts Postgres, GoTrue,
# and PostgREST. Leave that empty and set SUPABASE_URL to use Supabase Cloud:
#   docker compose up -d api worker
# Profile "tls" adds Caddy on ports 80 and 443.

name: fizzlayer

configs:
  db-init:
    content: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      create schema if not exists extensions;
      create schema if not exists auth;
      create extension if not exists pgcrypto with schema extensions;
      SQL
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      do $$body$$
      begin
        if not exists (select 1 from pg_roles where rolname = 'anon') then
          create role anon nologin noinherit;
        end if;
        if not exists (select 1 from pg_roles where rolname = 'authenticated') then
          create role authenticated nologin noinherit;
        end if;
        if not exists (select 1 from pg_roles where rolname = 'service_role') then
          create role service_role nologin noinherit bypassrls;
        end if;
      end
      $$body$$;
      SQL
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v authenticator_password="$$AUTHENTICATOR_PASSWORD" <<'SQL'
      select case
        when exists (select 1 from pg_roles where rolname = 'authenticator') then 'select 1'
        else format('create role authenticator noinherit login password %L', :'authenticator_password')
      end
      \gexec
      grant anon, authenticated, service_role to authenticator;
      grant usage on schema public, extensions to anon, authenticated, service_role, authenticator;
      SQL
  gateway-caddy:
    content: |
      :8000 {
      	handle /auth/v1/* {
      		uri strip_prefix /auth/v1
      		reverse_proxy auth:9999
      	}
      	handle /rest/v1/* {
      		uri strip_prefix /rest/v1
      		reverse_proxy rest:3000
      	}
      	respond "not found" 404
      }
  tls-caddy:
    content: |
      {$$FIZZ_DOMAIN:localhost} {
      	tls {$$FIZZ_ACME_EMAIL:internal}
      	encode gzip
      	handle /live/* {
      		reverse_proxy worker:8080
      	}
      	handle {
      		reverse_proxy api:8080
      	}
      }

services:
  db:
    profiles: ["local"]
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: db-init
        target: /docker-entrypoint-initdb.d/00-fizz.sh
        mode: 0755
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  auth:
    profiles: ["local"]
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@localhost}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Fizzlayer}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /api/auth
      GOTRUE_MAILER_URLPATHS_INVITE: /api/auth
      GOTRUE_MAILER_URLPATHS_RECOVERY: /api/auth
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /api/auth
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
    restart: unless-stopped

  rest:
    profiles: ["local"]
    image: postgrest/postgrest:v14.5
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_SERVER_PORT: "3000"
    command: ["postgrest"]
    restart: unless-stopped

  gateway:
    profiles: ["local"]
    image: caddy:2
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
    configs:
      - source: gateway-caddy
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

  migrate:
    profiles: ["local"]
    image: ${FIZZ_API_IMAGE:-fizzlayer/fizzlayer-api:latest}
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HOME: /tmp
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  api:
    image: ${FIZZ_API_IMAGE:-fizzlayer/fizzlayer-api:latest}
    pull_policy: missing
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: false
      gateway:
        condition: service_started
        required: false
    environment:
      PORT: "8080"
      SUPABASE_URL: ${SUPABASE_URL:-http://gateway:8000}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8080}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FIZZ_ALLOW_INSECURE_HTTP: ${FIZZ_ALLOW_INSECURE_HTTP:-1}
      FIZZ_AUTH_UPSTREAM: ${FIZZ_AUTH_UPSTREAM-}
      FIZZ_PUBLIC_HOST: ${FIZZ_PUBLIC_HOST:-localhost:8080}
      FIZZ_PUBLIC_SCHEME: ${FIZZ_PUBLIC_SCHEME:-http}
      FIZZ_STREAM_URL: ${FIZZ_STREAM_URL:-http://localhost:8081}
      FIZZ_MQTT_TCP_URL: ${FIZZ_MQTT_TCP_URL:-mqtt://localhost:1883}
      CRON_SECRET: ${CRON_SECRET:-}
      FIZZ_CRON_SECONDS: ${FIZZ_CRON_SECONDS:-60}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AGENTPHONE_API_KEY: ${AGENTPHONE_API_KEY:-}
      AGENTPHONE_AGENT_ID: ${AGENTPHONE_AGENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TINKERER: ${STRIPE_PRICE_TINKERER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    ports:
      - "${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    image: ${FIZZ_WORKER_IMAGE:-fizzlayer/fizzlayer-worker:latest}
    pull_policy: missing
    depends_on:
      gateway:
        condition: service_started
        required: false
    environment:
      PORT: "8080"
      MQTT_TCP_PORT: ${MQTT_TCP_PORT:-1883}
      SUPABASE_URL: ${SUPABASE_URL:-http://gateway:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FIZZ_ALLOW_INSECURE_HTTP: ${FIZZ_ALLOW_INSECURE_HTTP:-1}
      FIZZ_STREAM_ORIGINS: ${FIZZ_STREAM_ORIGINS:-http://localhost:8080}
    ports:
      - "${WORKER_PORT:-8081}:8080"
      - "${MQTT_PORT:-1883}:1883"
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2
    depends_on:
      - api
      - worker
    environment:
      FIZZ_DOMAIN: ${FIZZ_DOMAIN:-localhost}
      FIZZ_ACME_EMAIL: ${FIZZ_ACME_EMAIL:-internal}
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: tls-caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
