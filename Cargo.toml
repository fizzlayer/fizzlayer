[package]
name = "fizz"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "The physical layer for AI agents"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
vercel_runtime = "2"

[[bin]]
name = "status"
path = "api/status.rs"

[[bin]]
name = "auth"
path = "api/auth.rs"

[[bin]]
name = "account"
path = "api/account.rs"

[[bin]]
name = "billing"
path = "api/billing.rs"

[[bin]]
name = "stripe-webhook"
path = "api/stripe-webhook.rs"

[[bin]]
name = "session"
path = "api/session.rs"

[[bin]]
name = "me"
path = "api/me.rs"

[[bin]]
name = "setup"
path = "api/setup.rs"

[[bin]]
name = "sensors"
path = "api/sensors.rs"

[[bin]]
name = "readings"
path = "api/readings.rs"

[[bin]]
name = "ingest"
path = "api/ingest.rs"

[[bin]]
name = "stream"
path = "api/stream.rs"

[[bin]]
name = "chat"
path = "api/chat.rs"

[[bin]]
name = "cron"
path = "api/cron.rs"

[[bin]]
name = "alerts"
path = "api/alerts.rs"

[[bin]]
name = "phone"
path = "api/phone.rs"

[[bin]]
name = "phones"
path = "api/phones.rs"

[[bin]]
name = "voice"
path = "api/voice.rs"

[[bin]]
name = "contact"
path = "api/contact.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[[bin]]
name = "agents"
path = "api/agents.rs"

[[bin]]
name = "devices"
path = "api/devices.rs"

[[bin]]
name = "fizz-serve"
path = "src/bin/fizz-serve.rs"

# Keep this table in sync with cli/Cargo.toml and
# supabase/compute/fizz-worker/Cargo.toml. protocol.rs is compiled into all
# three packages, so a lint enabled in only one of them will fail that package
# when the shared file trips it.
#
# Levels are warn. The lint workflow passes `-D warnings`, so a warning fails CI.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Curated pedantic lints. The full pedantic group stays off: it is mostly
# documentation nits and function-length limits. See CODE_QUALITY.md.
map_unwrap_or = "warn"
manual_let_else = "warn"
unreadable_literal = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
uninlined_format_args = "warn"
ignored_unit_patterns = "warn"
format_collect = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_assert = "warn"
manual_string_new = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
match_same_arms = "warn"
single_match_else = "warn"
