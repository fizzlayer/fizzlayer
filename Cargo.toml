[package]
name = "fizz"
version = "0.1.0"
edition = "2024"
description = "The physical layer for AI agents"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
vercel_runtime = "2"

[[bin]]
name = "status"
path = "api/status.rs"

[[bin]]
name = "auth"
path = "api/auth.rs"

[[bin]]
name = "account"
path = "api/account.rs"

[[bin]]
name = "billing"
path = "api/billing.rs"

[[bin]]
name = "stripe-webhook"
path = "api/stripe-webhook.rs"

[[bin]]
name = "session"
path = "api/session.rs"

[[bin]]
name = "me"
path = "api/me.rs"

[[bin]]
name = "setup"
path = "api/setup.rs"

[[bin]]
name = "sensors"
path = "api/sensors.rs"

[[bin]]
name = "readings"
path = "api/readings.rs"

[[bin]]
name = "ingest"
path = "api/ingest.rs"

[[bin]]
name = "stream"
path = "api/stream.rs"

[[bin]]
name = "chat"
path = "api/chat.rs"

[[bin]]
name = "cron"
path = "api/cron.rs"

[[bin]]
name = "alerts"
path = "api/alerts.rs"

[[bin]]
name = "phone"
path = "api/phone.rs"

[[bin]]
name = "phones"
path = "api/phones.rs"

[[bin]]
name = "voice"
path = "api/voice.rs"

[[bin]]
name = "contact"
path = "api/contact.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[[bin]]
name = "agents"
path = "api/agents.rs"

[[bin]]
name = "devices"
path = "api/devices.rs"

[[bin]]
name = "fizz-serve"
path = "src/bin/fizz-serve.rs"
