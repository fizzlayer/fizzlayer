# Validate the Home Assistant integration in custom_components/fizzlayer.
# HACS treats this monorepo as one integration repository: hacs.json is at the
# root and custom_components/ contains only fizzlayer.
name: Home Assistant

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
          # license and topics read GitHub's detected repository metadata, not
          # the files in this pull request. LICENSE is Apache-2.0, copyright Fizzlayer LLC.
          # Drop "license" from ignore after GitHub shows that SPDX license on
          # the default branch. Topics are still unset.
          ignore: license topics

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Ruff 0.17.5
        run: pip install ruff==0.17.5
      - name: Ruff
        run: |
          ruff check custom_components/fizzlayer tests/homeassistant
          ruff format --check custom_components/fizzlayer tests/homeassistant
