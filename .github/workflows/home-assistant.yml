# Validate the Home Assistant integration in custom_components/fizzlayer.
# HACS treats this monorepo as one integration repository: hacs.json is at the
# root and custom_components/ contains only fizzlayer.
name: Home Assistant

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
          # license and topics read GitHub repository settings, not files in
          # this pull request. This repository has no detected SPDX license
          # and no topics, so those checks cannot pass from the workflow.
          # Remove an entry after that setting exists.
          ignore: license topics

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
