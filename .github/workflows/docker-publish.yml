name: Container images
on:
  pull_request:
    paths:
      - .github/workflows/docker-publish.yml
      - deploy/Dockerfile.api
      - deploy/migrate.sh
      - supabase/compute/fizz-worker/**
      - supabase/compute/fizz-protocol/**
      - supabase/migrations/**
      - Cargo.toml
      - Cargo.lock
      - src/**
      - api/**
      - public/**
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    # The API and worker builds do not depend on each other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fizzlayer-api
            file: deploy/Dockerfile.api
            context: .
          - name: fizzlayer-worker
            file: supabase/compute/fizz-worker/Dockerfile
            context: supabase/compute
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is unset. Pulls and local builds still use the public Docker Hub images."
          fi
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Authenticate before the build so base-image pulls use Docker Hub's higher limit.
      # The Dockerfiles keep a public docker.io FROM, so a local build needs no login.
      - name: Log in to Docker Hub
        if: steps.hub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          PUSH_HUB: ${{ steps.hub.outputs.push }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE: ${{ matrix.name }}
        run: |
          ns="${DOCKERHUB_NAMESPACE:-fizzlayer}"
          tags="ghcr.io/fizzlayer/${IMAGE}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="${tags},ghcr.io/fizzlayer/${IMAGE}:latest"
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              tags="${tags},ghcr.io/fizzlayer/${IMAGE}:${GITHUB_REF_NAME}"
              ;;
          esac
          if [ "$PUSH_HUB" = "true" ]; then
            tags="${tags},${ns}/${IMAGE}:sha-${GITHUB_SHA}"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tags="${tags},${ns}/${IMAGE}:latest"
            fi
            case "$GITHUB_REF" in
              refs/tags/v*)
                tags="${tags},${ns}/${IMAGE}:${GITHUB_REF_NAME}"
                ;;
            esac
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tags}"
      - name: Build and push
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_CONTEXT: ${{ matrix.context }}
          IMAGE_FILE: ${{ matrix.file }}
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          platforms="linux/amd64,linux/arm64"
          cmd=(docker buildx build --pull --file "$IMAGE_FILE")
          if [ "$PUBLISH" = "true" ]; then
            if [ -z "${IMAGE_TAGS}" ]; then
              echo "No tags to publish."
              exit 1
            fi
            IFS=',' read -ra tags <<< "$IMAGE_TAGS"
            for tag in "${tags[@]}"; do
              cmd+=(--tag "$tag")
            done
            # Tags are applied only by this build. A failed attempt does not retag an older image.
            cmd+=(--push --platform "$platforms")
          else
            mkdir -p /tmp/image-build
            cmd+=(--platform linux/amd64 --output "type=oci,dest=/tmp/image-build/${IMAGE_NAME}.oci")
          fi
          cmd+=("$IMAGE_CONTEXT")
          rate_limited() {
            grep -Eq '429 Too Many Requests|toomanyrequests|Rate exceeded' "$1"
          }
          attempt=1
          max=3
          while true; do
            log="$(mktemp)"
            set +e
            "${cmd[@]}" 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -eq 0 ]; then
              rm -f "$log"
              exit 0
            fi
            if [ "$attempt" -ge "$max" ] || ! rate_limited "$log"; then
              echo "Build failed (attempt ${attempt}/${max}, exit ${status})."
              rm -f "$log"
              exit "$status"
            fi
            wait="$((attempt * 30))"
            echo "Registry rate limit (attempt ${attempt}/${max}). Retrying the same checkout in ${wait}s."
            rm -f "$log"
            attempt="$((attempt + 1))"
            sleep "$wait"
          done
