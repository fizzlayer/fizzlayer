name: Container images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fizzlayer-api
            file: deploy/Dockerfile.api
            context: .
          - name: fizzlayer-worker
            file: supabase/compute/fizz-worker/Dockerfile
            context: supabase/compute/fizz-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is unset. Skipping Docker Hub and publishing only to ghcr.io."
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.hub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          PUSH_HUB: ${{ steps.hub.outputs.push }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE: ${{ matrix.name }}
        run: |
          ns="${DOCKERHUB_NAMESPACE:-fizzlayer}"
          tags="ghcr.io/fizzlayer/${IMAGE}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="${tags},ghcr.io/fizzlayer/${IMAGE}:latest"
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              tags="${tags},ghcr.io/fizzlayer/${IMAGE}:${GITHUB_REF_NAME}"
              ;;
          esac
          if [ "$PUSH_HUB" = "true" ]; then
            tags="${tags},${ns}/${IMAGE}:sha-${GITHUB_SHA}"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tags="${tags},${ns}/${IMAGE}:latest"
            fi
            case "$GITHUB_REF" in
              refs/tags/v*)
                tags="${tags},${ns}/${IMAGE}:${GITHUB_REF_NAME}"
                ;;
            esac
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tags}"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
