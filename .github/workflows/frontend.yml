# Gleam frontend: format, compile, test, and confirm the served scripts match.
name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gleam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Gleam formatting
        run: |
          source scripts/install-gleam.sh
          cd frontend && gleam format --check
      - name: Test the Gleam frontend
        run: cd frontend && gleam test
      - name: Build the scripts the site serves
        run: scripts/build-frontend.sh
      - name: Check the generated scripts
        run: |
          for script in public/analytics.js public/enterprise.js public/gateway-beta.js public/nav.js public/sensor-kinds.js public/status.js; do
            test -s "$script"
            node --check "$script"
          done
