# rustfmt from Rust 1.94.0, the MSRV in rust-toolchain.toml.
# Nightly-only options are intentionally absent. Defaults that would reformat
# an already-clean tree (for example `use_field_init_shorthand`) stay at the
# stable default. See CODE_QUALITY.md.
edition = "2024"
style_edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
